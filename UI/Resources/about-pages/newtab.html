<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>New Tab</title>
        <link rel="stylesheet" href="resource://ladybird/ladybird.css" />
        <link rel="stylesheet" href="resource://ladybird/about-pages/webui.css" />
        <link rel="stylesheet" href="resource://ladybird/about-pages/xenon.css" />
        <link rel="stylesheet" href="resource://ladybird/about-pages/newtab.css" />
        <script src="resource://ladybird/about-pages/newtab.js"></script>
    </head>
    <body>
        <main id="everyday" class="home" hidden>
            <ol id="dial" class="dial" aria-label="Most visited"></ol>

            <section id="recently-closed" class="recently-closed" aria-labelledby="recently-closed-title" hidden>
                <h2 id="recently-closed-title" class="closed-heading">Recently closed</h2>
                <ol id="recently-closed-list" class="closed-list"></ol>
            </section>
        </main>

        <main id="private-window" class="private-column" hidden>
            <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
                <path
                    class="orbit"
                    stroke-width="10"
                    d="M43.01 61.99A33 13.5 45 0 1 42.30 27.68M56.99 38.01A33 13.5 45 0 1 57.70 72.32"
                />
                <path
                    class="orbit orbit-rose"
                    stroke-width="10"
                    d="M61.99 56.99A33 13.5 -45 0 1 27.68 57.70M38.01 43.01A33 13.5 -45 0 1 72.32 42.30"
                />
                <circle class="nucleus" cx="50" cy="50" r="6.5" />
            </svg>
            <h1 class="page-title">Private window</h1>
            <p class="page-lede">
                Pages you open here stay out of your history, and their cookies go when you close the window. Sites and
                your network can still see what you do.
            </p>

            <p class="restart">
                <svg
                    viewBox="0 0 16 16"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.6"
                    stroke-linecap="round"
                    aria-hidden="true"
                >
                    <path d="M13 8a5 5 0 1 1-1.5-3.6" />
                    <path d="M13 2.5v3h-3" />
                </svg>
                To start over now, press <span class="badge">Private</span> on the toolbar and choose
                <strong>Restart Private Session</strong>.
            </p>
        </main>

        <a
            id="customize"
            class="customize"
            href="about:settings#startup"
            title="Customize"
            aria-label="Customize"
            hidden
        >
            <svg
                viewBox="0 0 16 16"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                aria-hidden="true"
            >
                <path d="M2.5 4.5h6M11.5 4.5h2M2.5 11.5h2M7.5 11.5h6" />
                <circle cx="10" cy="4.5" r="1.5" />
                <circle cx="6" cy="11.5" r="1.5" />
            </svg>
        </a>
    </body>
</html>
