<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>New Tab</title>
        <link rel="stylesheet" href="resource://ladybird/ladybird.css" />
        <link rel="stylesheet" href="resource://ladybird/about-pages/webui.css" />
        <link rel="stylesheet" href="resource://ladybird/about-pages/xenon.css" />
        <link rel="stylesheet" href="resource://ladybird/about-pages/newtab.css" />
        <script src="resource://ladybird/about-pages/newtab.js"></script>
    </head>
    <body>
        <header class="topbar">
            <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
                <path
                    class="orbit"
                    stroke-width="8"
                    d="M43.01 61.99A33 13.5 45 0 1 42.30 27.68M56.99 38.01A33 13.5 45 0 1 57.70 72.32"
                />
                <path
                    class="orbit orbit-rose"
                    stroke-width="8"
                    d="M61.99 56.99A33 13.5 -45 0 1 27.68 57.70M38.01 43.01A33 13.5 -45 0 1 72.32 42.30"
                />
                <circle class="nucleus" cx="50" cy="50" r="5.5" />
            </svg>
        </header>

        <main>
            <h1 class="visually-hidden">New Tab</h1>
            <h2 id="top-sites-title" class="top-sites-title" hidden>Most visited</h2>
            <ol id="top-sites" class="top-sites" aria-labelledby="top-sites-title"></ol>
            <p id="no-sites" class="note" hidden>Sites you visit often will show up here.</p>
            <p id="private-window" class="note" hidden>
                <strong>This is a private window.</strong>
                Nothing you do here is saved to your history, and its cookies go when you close it.
            </p>
        </main>
    </body>
</html>
