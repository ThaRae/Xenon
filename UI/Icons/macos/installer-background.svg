<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
    <!--
        The background of the window Xenon's installer disk image opens in (Meta/release.py): Xenon.app at (170, 190)
        and the Applications folder at (470, 190), with an arrow between them. Meta/generate-app-icon.py renders it at 1x
        and 2x. The colors are the light internal pages' (UI/Resources/about-pages/xenon.css): the page, its faint
        backdrop orbits, the muted text, and the rose.
    -->
    <defs>
        <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fbf0f4"/>
            <stop offset="1" stop-color="#faf8f9"/>
        </linearGradient>
    </defs>
    <rect width="640" height="400" fill="url(#page)"/>
    <g fill="none" stroke-width="1.5" transform="translate(320 190)">
        <ellipse rx="300" ry="107" transform="rotate(30)" stroke="#1a1517" stroke-opacity="0.06"/>
        <ellipse rx="300" ry="107" transform="rotate(-30)" stroke="#ff0050" stroke-opacity="0.12"/>
    </g>
    <g fill="none" stroke="#ff0050" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M262 190 H376"/>
        <path d="M362 176 L378 190 L362 204"/>
    </g>
    <text x="320" y="338" text-anchor="middle" fill="#6e6569" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="14">Drag Xenon into Applications to install it</text>
</svg>
