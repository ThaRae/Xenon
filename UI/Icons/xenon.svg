<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <!--
        Xenon's app icon artwork, full bleed: Meta/generate-app-icon.py adds the rounded-square mask and shadow.
        Two orbits woven over and under each other around a nucleus. The white one passes over at the left and right
        crossings, the rose one at the top and bottom; the masks cut a gap in whichever orbit passes under.
        The crossings sit 16.65 from the center, where both ellipses (35 by 12.5, turned 45 degrees) meet the axes.
    -->
    <defs>
        <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#2e1621"/>
            <stop offset="1" stop-color="#0d0a0c"/>
        </linearGradient>
        <mask id="white-passes-under" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
            <rect width="100" height="100" fill="#fff"/>
            <circle cx="50" cy="33.35" r="6.75" fill="#000"/>
            <circle cx="50" cy="66.65" r="6.75" fill="#000"/>
        </mask>
        <mask id="rose-passes-under" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
            <rect width="100" height="100" fill="#fff"/>
            <circle cx="33.35" cy="50" r="6.75" fill="#000"/>
            <circle cx="66.65" cy="50" r="6.75" fill="#000"/>
        </mask>
    </defs>
    <rect width="100" height="100" fill="url(#background)"/>
    <g mask="url(#white-passes-under)">
        <ellipse cx="50" cy="50" rx="35" ry="12.5" transform="rotate(45 50 50)" fill="none" stroke="#ffffff" stroke-width="5"/>
    </g>
    <g mask="url(#rose-passes-under)">
        <ellipse cx="50" cy="50" rx="35" ry="12.5" transform="rotate(-45 50 50)" fill="none" stroke="#ff0050" stroke-width="5"/>
    </g>
    <circle cx="50" cy="50" r="5" fill="#ffffff"/>
</svg>
