<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <!--
        xenon.svg redrawn for 32px and below, where its strokes and the gaps in the weave would fall under a pixel:
        heavier orbits on a slightly smaller, rounder ellipse (33 by 13.5), wider gaps, and a smaller nucleus so it
        stays clear of the orbits. The crossings sit 17.67 from the center.
    -->
    <defs>
        <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#2e1621"/>
            <stop offset="1" stop-color="#0d0a0c"/>
        </linearGradient>
        <mask id="white-passes-under" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
            <rect width="100" height="100" fill="#fff"/>
            <circle cx="50" cy="32.33" r="9" fill="#000"/>
            <circle cx="50" cy="67.67" r="9" fill="#000"/>
        </mask>
        <mask id="rose-passes-under" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
            <rect width="100" height="100" fill="#fff"/>
            <circle cx="32.33" cy="50" r="9" fill="#000"/>
            <circle cx="67.67" cy="50" r="9" fill="#000"/>
        </mask>
    </defs>
    <rect width="100" height="100" fill="url(#background)"/>
    <g mask="url(#white-passes-under)">
        <ellipse cx="50" cy="50" rx="33" ry="13.5" transform="rotate(45 50 50)" fill="none" stroke="#ffffff" stroke-width="8"/>
    </g>
    <g mask="url(#rose-passes-under)">
        <ellipse cx="50" cy="50" rx="33" ry="13.5" transform="rotate(-45 50 50)" fill="none" stroke="#ff0050" stroke-width="8"/>
    </g>
    <circle cx="50" cy="50" r="5.5" fill="#ffffff"/>
</svg>
