name: CI

# Gitea Actions (git.avx512.dev). slab starts an ephemeral runner per job, Ubuntu 24.04 with Docker, from one of two
# pools (slab-infra's dispatcher):
#   slab        2 vCPU, 4 GB, two at a time: the fast checks
#   slab-large  16 vCPU, 16 GB, one at a time, shared with pixel9-linux: the full build
# The build runs in Ladybird's own CI image (Meta/ci/build-in-ladybird-image.sh), at the version the pinned submodule
# names, so Xenon is built and tested with exactly what Ladybird is. Runs on the same ref cancel older ones.
#
# Secrets: CCACHE_TOKEN, slab-ccache's bearer token, caches compiled objects and vcpkg's packages between runs. Without
# it every build starts cold, which takes a couple of hours on slab-large.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Formatting and Xenon's invariants (Meta/check.py, the same script the pre-push hook runs): includes that would
  # resolve to Ladybird's headers, sources missing from the build, page overrides upstream no longer ships, malformed
  # !bangs, Ladybird's palette creeping back, and a submodule commit that doesn't exist upstream.
  checks:
    runs-on: slab
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: builtin:checkout   # built into Gitea Runner: no Node, no action download

      - name: Check out Ladybird (the pinned submodule)
        run: git submodule update --init --depth 1 ladybird

      - name: Install the checkers
        # Meta/check.py installs clang-format and ruff itself, at Ladybird's CI versions; it needs venv for that, npx
        # for prettier, and shellcheck.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q python3-venv npm shellcheck

      - name: Meta/check.py
        run: Meta/check.py --online

  build:
    needs: checks
    runs-on: slab-large
    timeout-minutes: 240
    steps:
      # A pull request's build can wait hours for slab-large behind others. If the pull request was merged or closed in
      # the meantime, building it would only hold up the queue, so the build stops here.
      - name: Check that the pull request is still open
        id: wanted
        if: github.event_name == 'pull_request'
        env:
          TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.api_url }}/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}
        run: |
          state=$(curl -sf -H "Authorization: token $TOKEN" "$PULL_REQUEST" | python3 -c 'import json, sys; print(json.load(sys.stdin)["state"])') || state=
          echo "The pull request is ${state:-in an unknown state, so it's built}."
          if [ "$state" = closed ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the repository
        if: steps.wanted.outputs.skip != 'true'
        uses: builtin:checkout

      - name: Check out Ladybird (the pinned submodule)
        if: steps.wanted.outputs.skip != 'true'
        run: |
          git submodule update --init --depth 1 ladybird
          echo "ladybird $(git -C ladybird rev-parse --short HEAD), CI image $(cat ladybird/Meta/Docker/ci/VERSION)"

      - name: Build Xenon and run its tests
        if: steps.wanted.outputs.skip != 'true'
        env:
          CCACHE_TOKEN: ${{ secrets.CCACHE_TOKEN }}
          CACHE_READ_ONLY: ${{ github.event_name == 'pull_request' }}
        run: time Meta/ci/build-in-ladybird-image.sh Meta/ci/build-and-test.sh

      - name: Summary
        if: always() && steps.wanted.outputs.skip != 'true'
        run: |
          summary=${GITEA_STEP_SUMMARY:-${GITHUB_STEP_SUMMARY:-/dev/null}}
          {
            echo "### Linux build"
            echo
            echo "Ladybird \`$(git -C ladybird rev-parse --short HEAD)\`, CI image \`$(cat ladybird/Meta/Docker/ci/VERSION)\`"
            if [ -f Build/release/smoke/welcome.png ]; then
              echo
              echo "Headless render of about:welcome: $(stat -c '%s bytes' Build/release/smoke/welcome.png) (artifact \`welcome-render\`)"
            fi
            if [ -f Build/release/ccache-stats.txt ]; then
              echo
              echo '```'
              cat Build/release/ccache-stats.txt
              echo '```'
            fi
          } >> "$summary"

      - name: Upload the dependency build logs
        if: failure() && steps.wanted.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-build-logs
          path: Build/vcpkg-release/buildtrees/*/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the welcome page render
        if: always() && steps.wanted.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: welcome-render
          path: Build/release/smoke/welcome.png
          if-no-files-found: ignore
          retention-days: 14
