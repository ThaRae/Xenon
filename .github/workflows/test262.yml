name: test262

on:
  push:
    branches: [main]
    paths: &paths
      - ladybird
      - Patches/ladybird/**
      - Meta/test262.py
      - Meta/ci/test262.sh
      - .github/workflows/test262.yml
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: test262-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test262:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force > /dev/null
          df -h /

      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Check out Ladybird (the pinned submodule)
        run: |
          git submodule update --init --depth 1 ladybird
          echo "IMAGE_VERSION=$(cat ladybird/Meta/Docker/ci/VERSION)" >> "$GITHUB_ENV"

      - name: Restore main's build caches
        uses: actions/cache/restore@v6
        with:
          path: |
            Build/caches
            ladybird/Build/caches
          key: linux-${{ env.IMAGE_VERSION }}-${{ github.sha }}
          restore-keys: linux-${{ env.IMAGE_VERSION }}-
          fail-on-cache-miss: true

      - name: Build test262-runner and run test262
        run: time Meta/ci/build-in-ladybird-image.sh Meta/ci/test262.sh

      - name: Summary
        if: always()
        run: cat Build/test262/summary.md >> "$GITHUB_STEP_SUMMARY" 2> /dev/null || echo "test262 didn't finish." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test262
          path: |
            Build/test262/xenon.json
            Build/test262/diff.txt
            Build/test262/summary.md
          if-no-files-found: ignore
          retention-days: 30
