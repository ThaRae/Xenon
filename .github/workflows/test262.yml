name: test262

# test262, the ECMAScript conformance suite, against Xenon's LibJS (the engine with Xenon's patches), as Ladybird's CI
# runs it on every change (ladybird/.github/workflows/libjs-test262.yml). Meta/test262.py compares each test's result
# with Ladybird's own run of the pinned commit, which LadybirdBrowser/libjs-data publishes, at the same test262
# revision, so whatever differs comes from the patches. A test that passes upstream and fails here fails the job; a
# timeout only shows in the summary, since GitHub's runners are slower than Ladybird's.
#
# Runs when the engine changes: on pull requests and pushes to main that change the patches or move the submodule, and
# by hand. Linux, in Ladybird's CI image, from the caches main's builds saved (ci.yml), which have LibJS compiled
# already; it builds only test262-runner, and doesn't save caches of its own.
on:
  push:
    branches: [main]
    paths: &paths
      - ladybird
      - Patches/ladybird/**
      - Meta/test262.py
      - Meta/ci/test262.sh
      - .github/workflows/test262.yml
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: test262-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test262:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      # As in ci.yml: the runner starts with about 20 GB free, and vcpkg's packages alone take much of it.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force > /dev/null
          df -h /

      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Check out Ladybird (the pinned submodule)
        run: |
          git submodule update --init --depth 1 ladybird
          echo "IMAGE_VERSION=$(cat ladybird/Meta/Docker/ci/VERSION)" >> "$GITHUB_ENV"

      - name: Restore main's build caches
        id: restore
        uses: actions/cache/restore@v6
        with:
          path: |
            Build/caches
            ladybird/Build/caches
          key: linux-${{ env.IMAGE_VERSION }}-${{ github.sha }}
          restore-keys: linux-${{ env.IMAGE_VERSION }}-

      # fail-on-cache-miss ignores restore-keys and insists on this exact
      # commit's cache, which only the linux job started alongside this run can
      # save, an hour or more out — so a fresh commit's run here raced that save
      # and passed only when the runner queue happened to hold it long enough.
      # Restore as ci.yml does (exact key, falling back to the newest cache from
      # the same image) and fail loudly when nothing matched at all, as right
      # after an image bump: without a cache, configuring alone builds every
      # dependency from source, for hours.
      - name: Fail when no cache was restored at all
        if: steps.restore.outputs.cache-matched-key == ''
        run: |
          echo "::error::No build cache matched linux-${{ env.IMAGE_VERSION }}-<sha> (neither this commit's nor an earlier one's from the same image). Once the CI linux job on this commit has saved one, rerun this workflow."
          exit 1

      - name: Build test262-runner and run test262
        run: time Meta/ci/build-in-ladybird-image.sh Meta/ci/test262.sh

      - name: Summary
        if: always()
        run: cat Build/test262/summary.md >> "$GITHUB_STEP_SUMMARY" 2> /dev/null || echo "test262 didn't finish." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test262
          path: |
            Build/test262/xenon.json
            Build/test262/diff.txt
            Build/test262/summary.md
          if-no-files-found: ignore
          retention-days: 30
