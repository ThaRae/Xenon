name: Benchmarks

# Ladybird's benchmark suites, run against Xenon as Ladybird's CI runs them against Ladybird on every push to master
# (ladybird/.github/workflows/web-benchmarks.yml and js-and-wasm-benchmarks.yml): LadybirdBrowser/web-benchmarks drives
# Xenon itself, headless, and LadybirdBrowser/js-benchmarks runs the js and wasm REPLs, which Xenon's build makes from
# the same engine with Xenon's patches. BrowserBench (Speedometer 3.1, JetStream 2.2 and MotionMark 1.3.1, through
# Meta/measure.py bench) can run too. Meta/ci/benchmarks.sh builds and runs one suite; Documentation/Memory.md has the
# local commands.
#
# GitHub's runners are shared machines, where a few percent either way is noise, so this isn't a check on pull requests:
# it runs weekly on main, and by hand on any branch. Each job's summary compares its results with main's last run of the
# same suite on the same platform (that run's artifact), and the results are kept as an artifact for 90 days. Ladybird's
# CI also posts its results to a dashboard; Xenon has none.
#
# Builds start from the caches main's builds saved (ci.yml) and don't save their own, so a run on a branch that changes
# much of the engine recompiles it. With no caches to start from, a job stops at once rather than spend hours on a cold
# build. It also runs on pull requests that change this workflow, with one run of each test, to show that it works.
on:
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:
    inputs:
      suites:
        description: Which suites
        type: choice
        options: [ladybird, all, web-benchmarks, js-benchmarks, browserbench]
        default: ladybird
      platforms:
        description: Where
        type: choice
        options: [both, linux, macos]
        default: both
      iterations:
        description: Runs of each test in Ladybird's suites (Ladybird's CI does 5)
        default: "3"
      web-benchmarks:
        description: web-benchmarks' suites, comma-separated (Speedometer3,WebKitDOM,...), or all
        default: all
      js-benchmarks:
        description: js-benchmarks' suites, comma-separated (or their prefixes), or all
        default: all
  pull_request:
    paths:
      - .github/workflows/benchmarks.yml
      - Meta/ci/benchmarks.sh

concurrency:
  group: benchmarks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # To find main's last run of each suite and download its results.
  actions: read

env:
  ITERATIONS: ${{ inputs.iterations || (github.event_name == 'pull_request' && '1' || '3') }}

jobs:
  linux:
    if: inputs.platforms != 'macos'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # Ladybird's two suites by hand and on pull requests, and BrowserBench as well on the weekly run. (A matrix can't
      # read the workflow's env, so the macos job repeats this.)
      matrix:
        suite: ${{ fromJSON(github.event_name == 'schedule' && '["web-benchmarks","js-benchmarks","bench"]' || (inputs.suites == 'all' && '["web-benchmarks","js-benchmarks","bench"]') || (inputs.suites == 'browserbench' && '["bench"]') || ((inputs.suites == '' || inputs.suites == 'ladybird') && '["web-benchmarks","js-benchmarks"]') || format('["{0}"]', inputs.suites)) }}
    name: linux (${{ matrix.suite }})
    steps:
      # As in ci.yml: the runner starts with about 20 GB free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force > /dev/null
          df -h /

      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Check out Ladybird (the pinned submodule)
        run: |
          git submodule update --init --depth 1 ladybird
          echo "IMAGE_VERSION=$(cat ladybird/Meta/Docker/ci/VERSION)" >> "$GITHUB_ENV"

      - name: Restore main's build caches
        uses: actions/cache/restore@v6
        with:
          path: |
            Build/caches
            ladybird/Build/caches
          key: linux-${{ env.IMAGE_VERSION }}-${{ github.sha }}
          restore-keys: linux-${{ env.IMAGE_VERSION }}-
          fail-on-cache-miss: true

      - name: Build and run ${{ matrix.suite }}
        timeout-minutes: 330
        env:
          SELECTION: ${{ matrix.suite == 'js-benchmarks' && inputs.js-benchmarks || inputs.web-benchmarks || 'all' }}
        run: Meta/ci/build-in-ladybird-image.sh Meta/ci/benchmarks.sh "${{ matrix.suite }}" "$ITERATIONS" "${SELECTION:-all}"

      - name: Download main's last results
        id: baseline
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARTIFACT: benchmarks-linux-${{ matrix.suite }}
        run: Meta/ci/benchmarks-baseline.sh "$ARTIFACT" Build/benchmarks/baseline

      - name: Summary
        if: always()
        env:
          SUITE: ${{ matrix.suite }}
          BASELINE_RUN: ${{ steps.baseline.outputs.run }}
        run: |
          {
            echo "### Linux: $SUITE"
            echo
            if [ -f "Build/benchmarks/$SUITE.json" ]; then
              if [ -n "$BASELINE_RUN" ]; then
                echo "Main's last results are from run [$BASELINE_RUN]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$BASELINE_RUN)."
                echo
              fi
              python3 Meta/measure.py report "Build/benchmarks/$SUITE.json" --baseline "Build/benchmarks/baseline/$SUITE.json"
            else
              echo "No results: the build or the suite stopped before it wrote any (see the log)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks-linux-${{ matrix.suite }}
          path: |
            Build/benchmarks/${{ matrix.suite }}.json
            Build/benchmarks/bench-dumps/
          if-no-files-found: ignore
          retention-days: 90

  macos:
    if: inputs.platforms != 'linux'
    runs-on: macos-26
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(github.event_name == 'schedule' && '["web-benchmarks","js-benchmarks","bench"]' || (inputs.suites == 'all' && '["web-benchmarks","js-benchmarks","bench"]') || (inputs.suites == 'browserbench' && '["bench"]') || ((inputs.suites == '' || inputs.suites == 'ladybird') && '["web-benchmarks","js-benchmarks"]') || format('["{0}"]', inputs.suites)) }}
    name: macos (${{ matrix.suite }})
    env:
      CCACHE_DIR: ${{ github.workspace }}/Build/caches/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 3G
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Check out Ladybird (the pinned submodule)
        run: git submodule update --init --depth 1 ladybird

      # The Xcode and the packages ci.yml's macos job uses, so that the caches it saved fit.
      - name: Select Xcode
        run: |
          version=$(sed -n "s/.*xcode-version: *'\{0,1\}\([0-9.]*\)'\{0,1\}.*/\1/p" ladybird/.github/actions/setup/action.yml)
          xcode=/Applications/Xcode_$version.app
          if [ ! -d "$xcode" ]; then
            echo "::warning::Xcode $version isn't on this runner; using the newest one"
            xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          fi
          sudo xcode-select --switch "$xcode"
          echo "XCODE_VERSION=$(xcodebuild -version | head -n 1)" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Install dependencies
        run: |
          brew update --quiet
          brew unlink openssl@3 || true
          brew install --quiet autoconf autoconf-archive automake bash ccache coreutils libtool llvm@22 nasm ninja pkg-config unzip

      # The Python Ladybird's CI runs the suites' runners with. It stays off the PATH, so the build uses the same Python
      # as ci.yml's.
      - name: Set up Python for the runners
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          update-environment: false

      - name: Restore main's build caches
        uses: actions/cache/restore@v6
        with:
          path: |
            Build/caches
            ladybird/Build/caches
          key: macos-${{ env.XCODE_VERSION }}-${{ github.sha }}
          restore-keys: macos-${{ env.XCODE_VERSION }}-
          fail-on-cache-miss: true

      - name: Build and run ${{ matrix.suite }}
        timeout-minutes: 330
        env:
          BENCHMARKS_PYTHON: ${{ steps.python.outputs.python-path }}
          SELECTION: ${{ matrix.suite == 'js-benchmarks' && inputs.js-benchmarks || inputs.web-benchmarks || 'all' }}
        run: |
          mkdir -p "$CCACHE_DIR"
          Meta/ci/benchmarks.sh "${{ matrix.suite }}" "$ITERATIONS" "${SELECTION:-all}"

      - name: Download main's last results
        id: baseline
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARTIFACT: benchmarks-macos-${{ matrix.suite }}
        run: Meta/ci/benchmarks-baseline.sh "$ARTIFACT" Build/benchmarks/baseline

      - name: Summary
        if: always()
        env:
          SUITE: ${{ matrix.suite }}
          BASELINE_RUN: ${{ steps.baseline.outputs.run }}
        run: |
          {
            echo "### macOS: $SUITE"
            echo
            if [ -f "Build/benchmarks/$SUITE.json" ]; then
              if [ -n "$BASELINE_RUN" ]; then
                echo "Main's last results are from run [$BASELINE_RUN]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$BASELINE_RUN)."
                echo
              fi
              python3 Meta/measure.py report "Build/benchmarks/$SUITE.json" --baseline "Build/benchmarks/baseline/$SUITE.json"
            else
              echo "No results: the build or the suite stopped before it wrote any (see the log)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks-macos-${{ matrix.suite }}
          path: |
            Build/benchmarks/${{ matrix.suite }}.json
            Build/benchmarks/bench-dumps/
          if-no-files-found: ignore
          retention-days: 90
