name: AUR

on:
  workflow_dispatch:
    inputs:
      xenon:
        description: Also build xenon, which builds Xenon from source (hours)
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/aur.yml
      - Meta/aur.py
      - Meta/ci/test-aur-package.sh
      - Packaging/aur/**

concurrency:
  group: aur-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  xenon-bin:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out Ladybird (the pinned submodule)
        run: git submodule update --init --depth 1 ladybird

      - name: Build, check, install and test xenon-bin
        run: Meta/ci/test-aur-package.sh xenon-bin

      - name: Upload the package
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aur-xenon-bin
          path: |
            Build/aur/*.pkg.tar.zst
            Build/distribution/smoke/welcome.png
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14

  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      xenon: ${{ steps.files.outputs.xenon }}
    steps:
      - name: List the changed files
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST/files" --paginate --jq '.[].filename')
          if grep -q '^Packaging/aur/xenon/' <<< "$files"; then
            echo "xenon=true" >> "$GITHUB_OUTPUT"
          fi

  xenon:
    needs: changes
    if: ${{ !cancelled() && ((github.event_name == 'workflow_dispatch' && inputs.xenon) || needs.changes.outputs.xenon == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force > /dev/null
          df -h /

      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out Ladybird (the pinned submodule)
        run: git submodule update --init --depth 1 ladybird

      - name: Restore the build caches
        uses: actions/cache/restore@v6
        with:
          path: Build/caches/aur
          key: aur-xenon-${{ github.run_id }}
          restore-keys: aur-xenon-

      - name: Build, check, install and test xenon
        timeout-minutes: 320
        run: time Meta/ci/test-aur-package.sh xenon

      - name: Save the build caches
        if: always()
        uses: actions/cache/save@v6
        with:
          path: Build/caches/aur
          key: aur-xenon-${{ github.run_id }}

      - name: Upload the package
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aur-xenon
          path: |
            Build/aur/*.pkg.tar.zst
            Build/distribution/smoke/welcome.png
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14
