name: AUR

# Builds Xenon's packages for the Arch User Repository (Packaging/aur) with makepkg, in Arch Linux's own container image,
# checks them with namcap, installs them with pacman, and runs Meta/release.py test's checks against the Xenon they
# install (Meta/ci/test-aur-package.sh). Documentation/Updates.md describes the packages.
#
# xenon-bin installs the published AppImage, which takes minutes, so it runs on every pull request that changes the
# packaging. xenon builds Xenon from source, which takes hours from a cold start, so it runs by hand with xenon ticked,
# and on pull requests that change its PKGBUILD. Nothing it builds is Ladybird's CI image's, so it can't start from
# main's build caches: it keeps ccache's objects and vcpkg's packages in a cache entry of its own (aur-xenon-...), so
# that a run that stops at the time limit leaves the next one less to build.
on:
  workflow_dispatch:
    inputs:
      xenon:
        description: Also build xenon, which builds Xenon from source (hours)
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/aur.yml
      - Meta/aur.py
      - Meta/ci/test-aur-package.sh
      - Packaging/aur/**

concurrency:
  group: aur-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  xenon-bin:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Meta/release.py test runs Meta/xenon.py's checks, which use the submodule's scripts.
      - name: Check out Ladybird (the pinned submodule)
        run: git submodule update --init --depth 1 ladybird

      - name: Build, check, install and test xenon-bin
        run: Meta/ci/test-aur-package.sh xenon-bin

      - name: Upload the package
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aur-xenon-bin
          path: |
            Build/aur/*.pkg.tar.zst
            Build/distribution/smoke/welcome.png
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14

  # Whether the pull request changes xenon's PKGBUILD, which is when it's built.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      xenon: ${{ steps.files.outputs.xenon }}
    steps:
      - name: List the changed files
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST/files" --paginate --jq '.[].filename')
          if grep -q '^Packaging/aur/xenon/' <<< "$files"; then
            echo "xenon=true" >> "$GITHUB_OUTPUT"
          fi

  xenon:
    needs: changes
    if: ${{ !cancelled() && ((github.event_name == 'workflow_dispatch' && inputs.xenon) || needs.changes.outputs.xenon == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      # The runner starts with about 20 GB free, and the build needs more. These are toolchains Xenon doesn't use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force > /dev/null
          df -h /

      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out Ladybird (the pinned submodule)
        run: git submodule update --init --depth 1 ladybird

      - name: Restore the build caches
        uses: actions/cache/restore@v6
        with:
          path: Build/caches/aur
          key: aur-xenon-${{ github.run_id }}
          restore-keys: aur-xenon-

      - name: Build, check, install and test xenon
        timeout-minutes: 320
        run: time Meta/ci/test-aur-package.sh xenon

      # Whether or not it finished, so that the next run carries on from here.
      - name: Save the build caches
        if: always()
        uses: actions/cache/save@v6
        with:
          path: Build/caches/aur
          key: aur-xenon-${{ github.run_id }}

      - name: Upload the package
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aur-xenon
          path: |
            Build/aur/*.pkg.tar.zst
            Build/distribution/smoke/welcome.png
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14
