name: Release

# Packages a release on GitHub's runners, as Meta/release.py package does: for macOS on a macOS runner, the installer
# disk image, the archive and the appcast; for Linux in Ladybird's CI image, the AppImage and its .zsync file, which is
# then tested on a few distributions. Each platform's files are an artifact of the run (Documentation/Updates.md).
#
# Run by hand with publish ticked, it then publishes the release as Meta/release.py publish does, once both platforms
# are done: the GitHub release on ThaRae/xenon-releases with the installer, the archive and the AppImage, the appcast
# there that installed Xenons update from, and the v<version> tag here. Only from main, and once per version. git and gh
# push with the XENON_RELEASES_TOKEN secret, a token that can write to both repositories; the run's own token stays
# read-only.
#
# It builds as ci.yml's macos and linux jobs do, from the build caches main's builds saved, and doesn't save its own. A
# cold build doesn't fit in one run, so with no caches to start from, it stops at once.
#
# The release certificate and the update key come from the repository's secrets: XENON_RELEASE_P12 (the certificate
# and its private key, a .p12 in base64) with XENON_RELEASE_P12_PASSWORD, and XENON_UPDATE_KEY (the key, as
# generate_keys -x writes it). The certificate goes into a keychain of the run's own, and both are deleted at the end.
# Only macOS uses them: the AppImage isn't signed.
#
# Runs by hand, and on pull requests that change this workflow or how releases are packaged. GitHub only lets a workflow
# be run by hand on a branch once it's on main or has run some other way, which the pull request that adds it does.
on:
  workflow_dispatch:
    inputs:
      test:
        description: Run Meta/release.py test first, which opens Xenon's windows
        type: boolean
        default: true
      publish:
        description: Publish it to ThaRae/xenon-releases, where installed Xenons update from (main only)
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Meta/release.py
      - Meta/ci/package-appimage.sh
      - Meta/ci/test-appimage.sh
      - UI/Linux/**

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 360
    env:
      CCACHE_DIR: ${{ github.workspace }}/Build/caches/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 3G
      # The keys installed Xenons know (Documentation/Updates.md). A secret that holds another key stops the run before
      # the build, rather than making a release that Xenon turns down, or that macOS takes for another app.
      UPDATE_PUBLIC_KEY: o7cmjh8R2wfWfRfJOTcyLisyoRVEEQIxi7L+SFWXUNI=
      CERTIFICATE_SHA1: EB4C4127CEA7DA5990952E139293BA15C0BA1D37
    steps:
      # Before the build, so that a run without them stops at once, and the release isn't published. Pull requests from
      # forks don't get them.
      - name: Check the secrets
        env:
          XENON_RELEASE_P12: ${{ secrets.XENON_RELEASE_P12 }}
          XENON_RELEASE_P12_PASSWORD: ${{ secrets.XENON_RELEASE_P12_PASSWORD }}
          XENON_UPDATE_KEY: ${{ secrets.XENON_UPDATE_KEY }}
          XENON_RELEASES_TOKEN: ${{ secrets.XENON_RELEASES_TOKEN }}
          PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: |
          status=0
          secrets=(XENON_RELEASE_P12 XENON_RELEASE_P12_PASSWORD XENON_UPDATE_KEY)
          [ "$PUBLISH" = true ] && secrets+=(XENON_RELEASES_TOKEN)
          for secret in "${secrets[@]}"; do
            if [ -z "${!secret}" ]; then
              echo "::error::The $secret secret isn't set (Documentation/Updates.md)"
              status=1
            fi
          done
          if [ "$PUBLISH" = true ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Releases are published from main, and this run is on $GITHUB_REF"
            status=1
          fi
          exit $status

      # Nothing in the run needs the checkout's own credentials, and publishing pushes with XENON_RELEASES_TOKEN instead.
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out Ladybird (the pinned submodule)
        run: |
          git submodule update --init --depth 1 ladybird
          echo "VERSION=$(cat VERSION.txt)" >> "$GITHUB_ENV"

      # Before the build too: each version is published once, so releasing again means bumping VERSION.txt. This also
      # finds out whether the token can read ThaRae/xenon-releases. A failure here stops the publish job too.
      - name: Check that the version isn't published yet
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ secrets.XENON_RELEASES_TOKEN }}
        run: |
          if gh api "repos/ThaRae/xenon-releases/releases/tags/v$VERSION" --silent 2> "$RUNNER_TEMP/release-check.txt"; then
            echo "::error::ThaRae/xenon-releases already has v$VERSION. Bump VERSION.txt to publish another release."
            exit 1
          elif ! grep -q "HTTP 404" "$RUNNER_TEMP/release-check.txt"; then
            echo "::error::XENON_RELEASES_TOKEN couldn't read ThaRae/xenon-releases: $(cat "$RUNNER_TEMP/release-check.txt")"
            exit 1
          fi

      # A keychain of the run's own, on the search list, where codesign finds the certificate. The partition list lets
      # Apple's tools use its key without asking.
      - name: Import the release certificate
        env:
          XENON_RELEASE_P12: ${{ secrets.XENON_RELEASE_P12 }}
          XENON_RELEASE_P12_PASSWORD: ${{ secrets.XENON_RELEASE_P12_PASSWORD }}
        run: |
          keychain=$RUNNER_TEMP/release.keychain-db
          password=$(uuidgen)
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$keychain"
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          (umask 077 && printf '%s' "$XENON_RELEASE_P12" | base64 --decode > "$RUNNER_TEMP/release.p12")
          security import "$RUNNER_TEMP/release.p12" -k "$keychain" -P "$XENON_RELEASE_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/release.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          identities=$(security find-identity -p codesigning)
          echo "$identities"
          if ! grep -q "$CERTIFICATE_SHA1 \"Xenon Release\"" <<< "$identities"; then
            echo "::error::XENON_RELEASE_P12 isn't the Xenon Release certificate, $CERTIFICATE_SHA1"
            exit 1
          fi

      # The key's public half, from its seed (as Meta/release.py does), must be the one installed Xenons know.
      - name: Check the update key
        env:
          XENON_UPDATE_KEY: ${{ secrets.XENON_UPDATE_KEY }}
        run: |
          openssl=/opt/homebrew/opt/openssl@3/bin/openssl
          public_key=$({ printf 302e020100300506032b657004220420 | xxd -r -p; printf '%s' "$XENON_UPDATE_KEY" | base64 --decode; } |
            "$openssl" pkey -inform DER -pubout -outform DER | tail -c 32 | base64)
          if [ "$public_key" != "$UPDATE_PUBLIC_KEY" ]; then
            echo "::error::XENON_UPDATE_KEY isn't Xenon's update key: its public half is $public_key"
            exit 1
          fi

      # The Xcode and the packages ci.yml's macos job uses, so that the caches it saved fit.
      - name: Select Xcode
        run: |
          version=$(sed -n "s/.*xcode-version: *'\{0,1\}\([0-9.]*\)'\{0,1\}.*/\1/p" ladybird/.github/actions/setup/action.yml)
          xcode=/Applications/Xcode_$version.app
          if [ ! -d "$xcode" ]; then
            echo "::warning::Xcode $version isn't on this runner; using the newest one"
            xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          fi
          sudo xcode-select --switch "$xcode"
          echo "XCODE_VERSION=$(xcodebuild -version | head -n 1)" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Install dependencies
        run: |
          brew update --quiet
          brew unlink openssl@3 || true
          brew install --quiet autoconf autoconf-archive automake bash ccache coreutils libtool llvm@22 nasm ninja pkg-config unzip

      - name: Restore the build caches
        uses: actions/cache/restore@v6
        with:
          path: |
            Build/caches
            ladybird/Build/caches
          key: macos-${{ env.XCODE_VERSION }}-${{ github.sha }}
          restore-keys: macos-${{ env.XCODE_VERSION }}-
          fail-on-cache-miss: true

      - name: Build Xenon
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache --zero-stats > /dev/null
          time ./Meta/xenon.py --jobs "$(sysctl -n hw.ncpu)" build
          ccache --show-stats

      - name: Meta/release.py test
        if: github.event_name != 'workflow_dispatch' || inputs.test
        run: ./Meta/release.py test --no-build --sign "Xenon Release"

      - name: Meta/release.py package
        env:
          XENON_UPDATE_KEY: ${{ secrets.XENON_UPDATE_KEY }}
        run: |
          (umask 077 && printf '%s\n' "$XENON_UPDATE_KEY" > "$RUNNER_TEMP/update-key.txt")
          ./Meta/release.py package --no-build --update-key "$RUNNER_TEMP/update-key.txt"

      # The archive's and the appcast's signatures, against the key the app was given, which must be the one installed
      # Xenons know; and the app's and the installer's code signatures, with the release certificate.
      - name: Verify the release
        run: |
          app=Build/distribution/Xenon.app
          archive=Build/distribution/Xenon-$VERSION.tar.xz
          installer=Build/distribution/Xenon-$VERSION.dmg
          appcast=Build/distribution/appcast.xml
          public_key=$(/usr/libexec/PlistBuddy -c "Print :SUPublicEDKey" "$app/Contents/Info.plist")
          if [ "$public_key" != "$UPDATE_PUBLIC_KEY" ]; then
            echo "::error::XENON_UPDATE_KEY isn't Xenon's update key: its public half is $public_key"
            exit 1
          fi
          sign_update=$(ls Build/release/Xenon/Sparkle-*/bin/sign_update | tail -n 1)
          signature=$(sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p' "$appcast")
          "$sign_update" --verify --ed-key-file "$RUNNER_TEMP/update-key.txt" "$archive" "$signature"
          "$sign_update" --verify --ed-key-file "$RUNNER_TEMP/update-key.txt" "$appcast"
          codesign --verify --deep --strict "$app"
          if ! grep -qx "Authority=Xenon Release" <<< "$(codesign -dvv "$app" 2>&1)"; then
            echo "::error::The app isn't signed with the Xenon Release certificate"
            exit 1
          fi
          codesign --verify --strict "$installer"
          if ! grep -qx "Authority=Xenon Release" <<< "$(codesign -dvv "$installer" 2>&1)"; then
            echo "::error::The installer isn't signed with the Xenon Release certificate"
            exit 1
          fi
          echo "The archive's and the appcast's signatures, and the app's and the installer's code signatures, check out."

      - name: Upload the release
        uses: actions/upload-artifact@v7
        with:
          name: Xenon-${{ env.VERSION }}-macos
          path: |
            Build/distribution/Xenon-${{ env.VERSION }}.dmg
            Build/distribution/Xenon-${{ env.VERSION }}.tar.xz
            Build/distribution/appcast.xml
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Delete the keychain and the update key
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then
            security delete-keychain "$KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/release.p12" "$RUNNER_TEMP/update-key.txt"

      - name: Summary
        if: always()
        run: |
          {
            echo "### macOS"
            echo
            echo "Built from \`$(git rev-parse --short HEAD)\`, with Ladybird \`$(git -C ladybird rev-parse --short HEAD)\` and $XCODE_VERSION"
            for file in Build/distribution/Xenon-$VERSION.dmg Build/distribution/Xenon-$VERSION.tar.xz; do
              if [ -f "$file" ]; then
                echo
                echo "\`$(basename "$file")\`: $(stat -f '%z' "$file") bytes, SHA-256 \`$(shasum -a 256 "$file" | cut -d ' ' -f 1)\`"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      # The runner starts with about 20 GB free, and the build needs more. These are toolchains Xenon doesn't use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force > /dev/null
          df -h /

      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out Ladybird (the pinned submodule)
        run: |
          git submodule update --init --depth 1 ladybird
          echo "IMAGE_VERSION=$(cat ladybird/Meta/Docker/ci/VERSION)" >> "$GITHUB_ENV"
          echo "VERSION=$(cat VERSION.txt)" >> "$GITHUB_ENV"

      - name: Restore the build caches
        uses: actions/cache/restore@v6
        with:
          path: |
            Build/caches
            ladybird/Build/caches
          key: linux-${{ env.IMAGE_VERSION }}-${{ github.sha }}
          restore-keys: linux-${{ env.IMAGE_VERSION }}-
          fail-on-cache-miss: true

      # In Ladybird's CI image, as ci.yml's linux job builds, so the AppImage holds the libraries Xenon is tested with.
      - name: Build Xenon, and Meta/release.py package
        timeout-minutes: 320
        run: time Meta/ci/build-in-ladybird-image.sh Meta/ci/package-appimage.sh

      - name: Upload the AppImage
        uses: actions/upload-artifact@v7
        with:
          name: Xenon-${{ env.VERSION }}-linux
          path: |
            Build/distribution/Xenon-${{ env.VERSION }}-x86_64.AppImage
            Build/distribution/Xenon-${{ env.VERSION }}-x86_64.AppImage.zsync
            Build/distribution/linux-requirements.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      # What linuxdeploy copied in, and what it left to the system.
      - name: Upload linuxdeploy's log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linuxdeploy-log
          path: Build/distribution/linuxdeploy.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          {
            echo "### Linux"
            echo
            echo "Built from \`$(git rev-parse --short HEAD)\`, with Ladybird \`$(git -C ladybird rev-parse --short HEAD)\` in its CI image \`$IMAGE_VERSION\`"
            file=Build/distribution/Xenon-$VERSION-x86_64.AppImage
            if [ -f "$file" ]; then
              echo
              echo "\`$(basename "$file")\`: $(stat -c '%s' "$file") bytes, SHA-256 \`$(sha256sum "$file" | cut -d ' ' -f 1)\`"
            fi
            if [ -f Build/distribution/linux-requirements.txt ]; then
              echo
              echo "It needs these of the system's glibc and libstdc++, or newer: $(cat Build/distribution/linux-requirements.txt)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The AppImage on distributions that have nothing of the build: Meta/release.py test runs Meta/xenon.py test's checks
  # against it, and loads a page over HTTPS (Meta/ci/test-appimage.sh).
  linux-test:
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: ubuntu-26.04
            image: ubuntu:26.04
          - distribution: fedora-44
            image: fedora:44
          - distribution: arch-linux
            image: archlinux:latest
    name: linux-test (${{ matrix.distribution }})
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out Ladybird (the pinned submodule)
        run: |
          git submodule update --init --depth 1 ladybird
          echo "VERSION=$(cat VERSION.txt)" >> "$GITHUB_ENV"

      - name: Download the AppImage
        uses: actions/download-artifact@v8
        with:
          name: Xenon-${{ env.VERSION }}-linux
          path: Build/distribution

      - name: Meta/release.py test
        env:
          IMAGE: ${{ matrix.image }}
        run: Meta/ci/test-appimage.sh "$IMAGE"

      - name: Upload the welcome page render
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: appimage-welcome-render-${{ matrix.distribution }}
          path: Build/distribution/smoke/welcome.png
          if-no-files-found: ignore
          retention-days: 14

  # Once both platforms are packaged, and the AppImage passed its tests. publish checks that the commit is on main and the
  # tree has no changes, then puts up the release, then the appcast, then the tag. The appcast's commit on
  # ThaRae/xenon-releases is the Actions bot's.
  publish:
    needs: [macos, linux, linux-test]
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out Ladybird (the pinned submodule)
        run: |
          git submodule update --init --depth 1 ladybird
          echo "VERSION=$(cat VERSION.txt)" >> "$GITHUB_ENV"

      - name: Download the macOS release
        uses: actions/download-artifact@v8
        with:
          name: Xenon-${{ env.VERSION }}-macos
          path: Build/distribution

      - name: Download the AppImage
        uses: actions/download-artifact@v8
        with:
          name: Xenon-${{ env.VERSION }}-linux
          path: Build/distribution

      - name: Meta/release.py publish
        id: publish
        env:
          GH_TOKEN: ${{ secrets.XENON_RELEASES_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          chmod +x "Build/distribution/Xenon-$VERSION-x86_64.AppImage"
          ./Meta/release.py publish --yes

      - name: Summary
        if: always()
        env:
          PUBLISHED: ${{ steps.publish.outcome }}
        run: |
          if [ "$PUBLISHED" = success ]; then
            echo "Published: https://github.com/ThaRae/xenon-releases/releases/tag/v$VERSION" >> "$GITHUB_STEP_SUMMARY"
          fi
