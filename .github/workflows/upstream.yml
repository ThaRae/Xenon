name: Upstream

# A canary for the next submodule bump: builds Xenon against Ladybird's latest master instead of the pinned commit, so
# an engine change that breaks Xenon shows up here first, not in the middle of a bump. Xenon's patch series
# (Patches/ladybird) is applied onto master first, and a patch that no longer applies fails the job by name. It also
# lists what changed upstream in UI/Qt, which Xenon's UI/ started as a copy of, so those changes can be ported. Nothing
# is committed.
#
# Runs weekly, on demand, and on pull requests that change this workflow. Linux only, in the same image as ci.yml; it
# starts from main's build caches and doesn't save its own.
on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
  pull_request:
    paths: [.github/workflows/upstream.yml]

concurrency:
  group: upstream-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-against-master:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force > /dev/null
          df -h /

      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Check out Ladybird's master
        run: |
          git submodule update --init --depth 1 ladybird
          pinned=$(git -C ladybird rev-parse HEAD)
          echo "IMAGE_VERSION=$(cat ladybird/Meta/Docker/ci/VERSION)" >> "$GITHUB_ENV"
          git -C ladybird fetch --depth 1 origin master
          git -C ladybird checkout --quiet FETCH_HEAD
          master=$(git -C ladybird rev-parse HEAD)
          echo "PINNED=$pinned" >> "$GITHUB_ENV"
          echo "MASTER=$master" >> "$GITHUB_ENV"
          echo "pinned $pinned, master $master"

      - name: What changed upstream in UI/Qt
        run: |
          git -C ladybird fetch --quiet --depth 1 origin "$PINNED"
          git -C ladybird diff --stat "$PINNED" "$MASTER" -- UI/Qt Base/res/ladybird/about-pages | tee upstream-ui-changes.txt

      - name: Apply Xenon's patches to master
        # The pinned commit was fetched above, which lets git am fall back to a three-way merge.
        run: Meta/patches.py apply --base "$MASTER"

      - name: Meta/check.py
        # The submodule is off its pin here on purpose, so skip that one comparison.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q python3-venv shellcheck
          Meta/check.py --unpinned

      - name: Restore main's build caches
        uses: actions/cache/restore@v4
        with:
          path: |
            Build/caches
            ladybird/Build/caches
          key: linux-${{ env.IMAGE_VERSION }}-${{ github.sha }}
          restore-keys: linux-${{ env.IMAGE_VERSION }}-

      - name: Build Xenon and run its tests
        timeout-minutes: 330
        run: time Meta/ci/build-in-ladybird-image.sh Meta/ci/build-and-test.sh

      - name: Summary
        if: always()
        run: |
          {
            echo "### Xenon against Ladybird master \`${MASTER:0:10}\`"
            echo
            echo "Pinned: \`${PINNED:0:10}\`. Upstream changes to the files Xenon copied or overrides:"
            echo
            echo '```'
            cat upstream-ui-changes.txt 2>/dev/null || echo "(none recorded)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
