name: Update

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      xenon_ref:
        description: The Xenon branch to build with, to try changes to the lists or this workflow before they're on main
        default: main

concurrency:
  group: update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the published lists
        uses: actions/checkout@v7

      - name: Check out Xenon
        uses: actions/checkout@v7
        with:
          repository: ThaRae/Xenon
          ref: ${{ inputs.xenon_ref || 'main' }}
          path: .build/Xenon
          persist-credentials: false

      - name: Check out xenon-ublock
        uses: actions/checkout@v7
        with:
          repository: ThaRae/xenon-ublock
          path: .build/xenon-ublock
          persist-credentials: false

      - name: Update Rust
        run: rustup update stable --no-self-update

      - name: Build and sign the lists
        env:
          FILTER_LISTS_SIGNING_KEY: ${{ secrets.FILTER_LISTS_SIGNING_KEY }}
        run: .build/Xenon/Meta/ci/publish-filter-lists.sh .

      - name: Publish them
        run: |
          git add -A manifest.json manifest.json.sig NOTICE.txt LICENSE-GPL-3.0.txt lists trusted-lists resources
          generated_at=$(python3 -c 'import json; print(json.load(open("manifest.json"))["generated_at"])')
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Lists generated $generated_at"
          git push -q origin HEAD:main
          git diff --stat HEAD~1 HEAD | tail -1
