[package]
name = "xenon_ui"
version = "0.0.0"
edition = "2024"
license = "BSD-2-Clause"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "781e2b6d87cd5f32d6f4365956fad4baaf24ee50", features = ["native-file-dialog"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }

[dev-dependencies]
serde_json = "1"

[features]
mock-engine = []

[[bin]]
name = "xenon-ui-preview"
path = "src/bin/xenon-ui-preview.rs"
required-features = ["mock-engine"]
