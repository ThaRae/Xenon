[package]
name = "xenon_ui"
version = "0.0.0"
edition = "2024"
license = "BSD-2-Clause"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "47eaa86eba751687597d0aaf6ee325baeecd4666", features = ["native-file-dialog"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }
libc = "0.2"
wayland-client = { version = "0.31", features = ["system"] }
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client"] }

[dev-dependencies]
serde_json = "1"

[lints.rust]
warnings = "deny"

[features]
mock-engine = []

[[bin]]
name = "xenon-ui-preview"
path = "src/bin/xenon-ui-preview.rs"
required-features = ["mock-engine"]

[patch."https://github.com/anomalyco/rune"]
rune = { path = "../../Build/rune/crates/rune" }

[patch.crates-io]
winit = { path = "../../Build/rune/vendor/winit" }
parley_engine = { path = "../../Build/rune/vendor/parley_engine" }
wgpu-hal = { path = "../../Build/rune/vendor/wgpu-hal" }
accesskit_windows = { path = "../../Build/rune/vendor/accesskit_windows" }
accesskit_macos = { path = "../../Build/rune/vendor/accesskit_macos" }
