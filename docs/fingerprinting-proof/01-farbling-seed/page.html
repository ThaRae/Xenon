<!doctype html>
<meta charset="utf-8" />
<title>Farbling seed readout</title>
<pre id="out">loading…</pre>
<iframe id="same" src="iframe.html?kind=same"></iframe>
<iframe id="cross" src="http://site-b.test:8080/iframe.html?kind=cross"></iframe>
<script>
const params = new URLSearchParams(location.search);
const runId = params.get("run") || "run";
const out = document.getElementById("out");
function info() {
    try {
        if (typeof internals === "undefined") return "no-internals";
        return internals.farblingSeedInfo();
    } catch (error) {
        return "error:" + String(error);
    }
}
const sample = {
    origin: location.origin,
    document: info(),
    sameIframe: null,
    crossIframe: null,
    worker: null,
    internalsPresent: typeof internals !== "undefined",
};
let remaining = 3;
function got() {
    remaining -= 1;
    if (remaining <= 0) finish();
}
function finish() {
    const samples = JSON.parse(sessionStorage.getItem("samples") || "[]");
    samples.push(sample);
    sessionStorage.setItem("samples", JSON.stringify(samples));
    out.textContent = "XENON-FARBLING " + JSON.stringify({ runId, samples });
    if (samples.length < 3) {
        location.reload();
        return;
    }
    fetch("/report?run=" + encodeURIComponent(runId), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ runId, host: location.host, samples }),
    }).finally(() => setTimeout(() => window.close(), 50));
}
window.addEventListener("message", event => {
    const text = String(event.data);
    if (text.startsWith("same-iframe")) sample.sameIframe = text;
    else sample.crossIframe = text;
    got();
});
const worker = new Worker("worker.js");
worker.onmessage = event => {
    sample.worker = String(event.data);
    got();
};
worker.onerror = event => {
    sample.worker = "error:" + event.message;
    got();
};
setTimeout(() => finish(), 8000);
</script>
