<!doctype html>
<meta charset="utf-8" />
<title>A webgl start</title>
<iframe id="cross" src="http://site-b.test:8080/iframe.html?kind=cross"></iframe>
<script src="measure.js"></script>
<script>
const params = new URLSearchParams(location.search);
const runId = params.get("run") || "same-process";
function post(key, value) {
    return fetch("/report?run=" + encodeURIComponent(runId), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ key, value, origin: location.origin, host: location.host }),
    });
}
const reloads = JSON.parse(sessionStorage.getItem("a-reloads") || "[]");
const sample = measureDocumentCanvases();
reloads.push({
    seed: sample.seed,
    webglHash: sample.webgl.hash,
    webgl2Hash: sample.webgl2.hash,
    webgl: sample.webgl,
    webgl2: sample.webgl2,
});
sessionStorage.setItem("a-reloads", JSON.stringify(reloads));
if (reloads.length < 3) {
    location.reload();
} else {
    const state = { seed: sample.seed, measure: sample, reloads, crossIframe: null, worker: null };
    function goToB() {
        location.href = "http://site-b.test:8080/from-b.html?run=" + encodeURIComponent(runId);
    }
    const iframeWait = new Promise(resolve => {
        window.addEventListener("message", event => {
            state.crossIframe = event.data;
            resolve();
        });
        setTimeout(resolve, 8000);
    });
    Promise.all([iframeWait, withWorker()]).then(([, worker]) => {
        state.worker = worker;
        return post("a-direct", state);
    }).then(goToB);
}
</script>
