<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>A hardware start</title>
<script src="measure.js"></script>
</head>
<body>
<script>
const params = new URLSearchParams(location.search);
const runId = params.get("run") || "same-process";
function post(key, value) {
    return fetch("/report?run=" + encodeURIComponent(runId), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ key, value, origin: location.origin, host: location.host }),
    });
}
function iframeSample(src) {
    return new Promise(resolve => {
        const timer = setTimeout(() => resolve({ error: "iframe-timeout" }), 6000);
        const onMessage = event => {
            if (event.source !== iframe.contentWindow)
                return;
            clearTimeout(timer);
            window.removeEventListener("message", onMessage);
            resolve(event.data);
        };
        window.addEventListener("message", onMessage);
        const iframe = document.createElement("iframe");
        iframe.src = src;
        document.body.appendChild(iframe);
    });
}
const reloads = JSON.parse(sessionStorage.getItem("a-reloads") || "[]");
const sample = sampleNavigator();
reloads.push(sample);
sessionStorage.setItem("a-reloads", JSON.stringify(reloads));
if (reloads.length < 3) {
    location.reload();
} else {
    Promise.all([
        iframeSample("iframe.html?kind=same"),
        iframeSample("http://site-b.test:8080/iframe.html?kind=cross"),
        withWorker(),
        withSharedWorker(),
    ]).then(([sameIframe, crossIframe, worker, sharedWorker]) => {
        const state = { measure: sample, reloads, sameIframe, crossIframe, worker, sharedWorker };
        return post("a-direct", state);
    }).then(() => {
        location.href = "http://site-b.test:8080/from-b.html?run=" + encodeURIComponent(runId);
    });
}
</script>
</body>
</html>
