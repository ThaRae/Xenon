<!doctype html>
<html>
<head><meta charset="utf-8" /><title>UA strict</title><script src="measure.js"></script></head>
<body>
<script>
const params = new URLSearchParams(location.search);
const runId = params.get("run") || "strict";
const next = params.get("next");
const key = params.get("key") || (location.host.includes("site-b") ? "b-strict" : "a-strict");
function post(name, value) {
    return fetch("/report?run=" + encodeURIComponent(runId), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ key: name, value }),
    });
}
try { internals.setFarblingLevel("strict"); } catch {}
const sample = navigatorSample();
post(key, sample).then(() => {
    if (next)
        location.href = next;
    else
        return post("complete", sample).then(() => setTimeout(() => window.close(), 50));
});
</script>
</body>
</html>
